name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; the build fails without it
      - run: npx prisma generate

      # tsc typechecks as it compiles
      - run: npm run build

      - run: npm test

      - run: npm audit --omit=dev --audit-level=high
