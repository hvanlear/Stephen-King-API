name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; the build fails without it
      - run: npx prisma generate

      # tsc typechecks as it compiles
      - run: npm run build

      - run: npm test

      # On PRs, also check that no id was removed or renumbered
      - name: Validate catalog data
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            npm run validate-data -- --base "origin/$BASE_REF"
          else
            npm run validate-data
          fi

      - run: npm audit --omit=dev --audit-level=high
